[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chana-osteoclast"
version = "0.1.0"
description = "Research pipeline for segmentation and quantification of cultured osteoclasts"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "NOASSERTION"}
authors = [
  {name = "Sarah Szabo"},
  {name = "Yuvraj Tripathy"},
  {name = "Leonard Clark"},
  {name = "Kyeong Heo"},
  {name = "Vicky Mody"},
  {name = "Shashidharamurthy Taval"},
]
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.8,<4.11",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "scikit-image>=0.21,<0.24",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
tensorflow = [
  "tensorflow==2.16.2",
  "keras==3.12.4",
  "keras-unet-collection==0.1.13",
]
analysis = [
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<0.14",
  "scikit-learn>=1.3,<2",
  "umap-learn>=0.5,<0.6",
]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
