reference_mask:
  background_value: 0
  foreground_value: 255
  foreground_pixels: 15395
  foreground_fraction: 0.058727264404296875
  notes: >-
    The deposited mask is preserved byte-for-byte. It contains one isolated
    one-pixel foreground component; no cleanup has been applied.

expected_output:
  probability_threshold: 0.5
  threshold_operator: greater_than_or_equal
  fill_holes: true
  predicted_foreground_pixels: 15087
  predicted_foreground_fraction: 0.057552337646484375
  watershed_peak_distance: 20
  watershed_label_count: 13
  internal_consistency_status: exact

overlay:
  verification_status: exact_from_deposited_source_outputs
  checkpoint_model_id: unresolved
  checkpoint_mapping_source: author_confirmation_2026-08-19
  colors_rgb:
    expert_reference_mask: [0, 184, 217]
    model_prediction: [255, 61, 113]
  color_mapping_source: paper/analysis/legacy/chana_main_manuscript_figures_tables.py
  notes: >-
    The author identified the inference model as U-Net++ with domain-curriculum
    training. The analysis export confirms cyan as the expert semantic mask and
    pink as the model prediction, and the deposited overlay is reconstructed
    exactly from the deposited image, masks, and configured colors. The exact
    checkpoint file remains unresolved because neither registered U-Net++ file
    reproduces the deposited probability map exactly. It is closer to the
    hash-identified curriculum checkpoint (whose legacy filename misleadingly
    contains no_Domain) than to the baseline checkpoint.
