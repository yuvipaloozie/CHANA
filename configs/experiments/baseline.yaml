experiment: expert_real_baseline
training_domain: expert_real_train
batch_size: 16
optimizer: AdamW
weight_decay: 0.0001
learning_rate_schedule: cosine_decay
augmentations:
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotation_limit_degrees: 20
  rotation_probability: 0.5
  brightness_contrast_probability: 0.2
  coarse_dropout:
    probability: 0.3
    max_holes: 6
    max_height: 24
    max_width: 24
architectures:
  unet:
    initial_learning_rate: 0.0001
    maximum_epochs: 400
  unetpp:
    initial_learning_rate: 0.0001
    maximum_epochs: 500
  transunet:
    initial_learning_rate: 0.00001
    maximum_epochs: 400
checkpoint_selection: validation_monitoring_as_implemented_in_legacy_export
