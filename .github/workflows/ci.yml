name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test environment
        run: python -m pip install -e ".[test]"
      - name: Validate model registry
        run: python scripts/validate_manifests.py
      - name: Validate deposited source data
        run: python scripts/validate_source_data.py
      - name: Validate cleared public sample
        run: python scripts/validate_sample_data.py --require-cleared
      - name: Run tests
        run: python -m pytest
